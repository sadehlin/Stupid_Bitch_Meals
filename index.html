<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#18181b" />
<link rel="manifest" href="/manifest.json" />
<title>Stupid Bitch Meals</title>
<style>
:root{--bg:#0f0f10;--card:#19191c;--soft:#242429;--text:#f7f7f5;--muted:#aaa;--accent:#f4c95d;--good:#86d58f;--warn:#f5bd64;--bad:#f47b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 16px 96px}h1{font-size:30px;margin:4px 0}.sub{color:var(--muted);margin-bottom:16px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}.tab{border:1px solid #34343a;background:var(--card);color:var(--text);padding:10px 12px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--text);color:#111}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid #2c2c31;border-radius:18px;padding:16px;margin-bottom:12px}.today{border-color:var(--accent);box-shadow:0 0 0 1px #f4c95d33}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.day{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.meal{font-size:18px;font-weight:750;margin-top:2px}.meta{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:var(--soft);font-size:12px}.stars button{background:none;border:0;color:#777;font-size:26px;padding:0 2px}.stars button.on{color:var(--accent)}button,input,select{font:inherit}.recipe details{margin-top:10px}.recipe summary{cursor:pointer;color:#ddd}.recipe ul,.recipe ol{padding-left:20px}.gitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2f}.gitem:last-child{border:0}.gitem input[type=checkbox]{width:22px;height:22px}.checked{opacity:.45;text-decoration:line-through}.section{font-weight:800;margin:18px 0 8px}.life{display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%}.good{background:var(--good)}.warn{background:var(--warn)}.bad{background:var(--bad)}.empty{color:var(--muted);text-align:center;padding:30px 8px}.btn{border:0;border-radius:12px;padding:10px 12px;background:var(--text);color:#111}.btn.secondary{background:var(--soft);color:var(--text)}.status{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#000;border:1px solid #333;padding:10px 14px;border-radius:999px;display:none;z-index:20}.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>Stupid Bitch Meals</h1>
<div class="sub">Dinner without opening seventeen tabs and hating your life.</div>
<div class="tabs">
<button class="tab active" data-tab="week">This Week</button>
<button class="tab" data-tab="recipes">Recipes</button>
<button class="tab" data-tab="groceries">Groceries</button>
<button class="tab" data-tab="usefirst">Use This Shit First</button>
<button class="tab" data-tab="favorites">Favorites</button>
</div>
<section id="week" class="panel active"><div id="weekList"></div></section>
<section id="recipes" class="panel"><div id="recipeList"></div></section>
<section id="groceries" class="panel"><div id="groceryList"></div></section>
<section id="usefirst" class="panel"><div id="useFirstList"></div></section>
<section id="favorites" class="panel"><div id="favList"></div></section>
</div>
<div id="status" class="status"></div>
<script>
const SB='https://bzxrnfgteqdndrgttjms.supabase.co';
const KEY='sb_publishable_Hz_DGBDYxSaHiGyK7PkUwQ_LLknUQdO';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
let recipes=[],meals=[],groceries=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(path){let r=await fetch(SB+'/rest/v1/'+path,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}
async function rpc(name,body){let r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());}
function toast(t){let s=document.getElementById('status');s.textContent=t;s.style.display='block';setTimeout(()=>s.style.display='none',1800)}
function daysLeft(g){if(g.package_use_by){let d=Math.ceil((new Date(g.package_use_by+'T12:00:00')-new Date())/86400000);return d}if(!g.purchased_at||!g.estimated_life_days)return null;return g.estimated_life_days-Math.floor((new Date()-new Date(g.purchased_at+'T12:00:00'))/86400000)}
function lifeClass(d){return d==null?'good':d<=1?'bad':d<=3?'warn':'good'}
function render(){renderWeek();renderRecipes();renderGroceries();renderUseFirst();renderFavs()}
function renderWeek(){const today=new Date().toLocaleDateString('en-US',{weekday:'long'});weekList.innerHTML=meals.map(m=>{let r=recipes.find(x=>x.id===m.recipe_id);return `<div class="card ${m.day_name===today?'today':''}"><div class="day">${esc(m.day_name)} ${m.day_name===today?'· TODAY':''}</div><div class="meal">${esc(m.meal_name)}</div>${r?`<div class="meta">${r.minutes||''} min · serves ${r.servings||3}</div>`:''}${r?stars(r):''}</div>`}).join('')||'<div class="empty">No meals loaded.</div>'}
function stars(r){return `<div class="stars" data-id="${r.id}" aria-label="Rate recipe">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" class="${(r.rating||0)>=n?'on':''}">★</button>`).join('')}</div>`}
function renderRecipes(){recipeList.innerHTML=recipes.map(r=>`<div class="card recipe"><div class="row"><div><div class="meal">${esc(r.name)}</div><div class="meta">${r.minutes||'?'} min · serves ${r.servings||3}</div></div>${r.rating?`<span class="pill">${r.rating}/5</span>`:''}</div>${stars(r)}<details><summary>Ingredients</summary><ul>${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details><details><summary>Directions</summary><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details></div>`).join('')}
function renderGroceries(){const cats=[...new Set(groceries.map(g=>g.category||'Other'))];groceryList.innerHTML=cats.map(c=>`<div class="section">${esc(c)}</div>${groceries.filter(g=>(g.category||'Other')===c).map(g=>`<div class="card gitem"><input type="checkbox" data-gid="${g.id}" ${g.checked?'checked':''}><div class="${g.checked?'checked':''}"><b>${esc(g.item)}</b><div class="small">${esc(g.quantity||'')}</div></div><span class="pill">${esc(g.storage||'')}</span></div>`).join('')}`).join('')}
function renderUseFirst(){let bought=groceries.filter(g=>g.checked||g.purchased_at).map(g=>({...g,d:daysLeft(g)})).sort((a,b)=>(a.d??999)-(b.d??999));useFirstList.innerHTML=bought.length?bought.map(g=>`<div class="card"><div class="row"><div><div class="meal">${esc(g.item)}</div><div class="meta">${g.d==null?'Life unknown':g.d<0?'Past estimate by '+Math.abs(g.d)+' day(s)':g.d+' day(s) left'} · ${esc(g.storage)}</div></div><div class="life"><span class="dot ${lifeClass(g.d)}"></span><span class="pill">${g.d==null?'CHECK':g.d<=1?'EAT NOW':g.d<=3?'SOON':'GOOD'}</span></div></div></div>`).join(''):'<div class="empty">Check groceries off when they arrive. Then this tab becomes your food triage nurse.</div>'}
function renderFavs(){let f=recipes.filter(r=>(r.rating||0)>=4||r.favorite);favList.innerHTML=f.length?f.map(r=>`<div class="card"><div class="meal">${esc(r.name)}</div><div class="meta">${r.rating||4}/5 · ${r.minutes||'?'} min</div>${stars(r)}</div>`).join(''):'<div class="empty">Rate meals 4–5 stars and they will live here.</div>'}
async function load(){try{[recipes,meals,groceries]=await Promise.all([get('sbg_recipes?select=*&order=id'),get('sbg_meal_plan?select=*&order=sort_order'),get('sbg_groceries?select=*&order=category,item')]);render()}catch(e){console.error(e);toast('Could not load data')}}
document.addEventListener('click',async e=>{if(e.target.matches('.tab')){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.getElementById(e.target.dataset.tab).classList.add('active')}if(e.target.dataset.rate){let id=+e.target.closest('.stars').dataset.id,n=+e.target.dataset.rate;try{await rpc('sbg_set_recipe_rating',{p_recipe_id:id,p_rating:n});let r=recipes.find(x=>x.id===id);r.rating=n;r.favorite=n>=4;render();toast('Rated '+n+'/5')}catch(err){toast('Rating failed')}}});
document.addEventListener('change',async e=>{if(e.target.dataset.gid){let id=+e.target.dataset.gid,v=e.target.checked;try{await rpc('sbg_set_grocery_checked',{p_grocery_id:id,p_checked:v});let g=groceries.find(x=>x.id===id);g.checked=v;if(v&&!g.purchased_at)g.purchased_at=new Date().toISOString().slice(0,10);render();toast(v?'Marked purchased':'Unchecked')}catch(err){toast('Update failed')}}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');load();
</script>
</body></html>
