<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18181b"><link rel="manifest" href="/manifest.json"><title>Stupid Bitch Meals</title><style>:root{--bg:#0f0f10;--card:#19191c;--soft:#29292e;--text:#f7f7f5;--muted:#aaa;--accent:#f4c95d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 16px 90px}h1{font-size:29px;margin:3px 0}.sub,.meta,.small{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0;position:sticky;top:0;background:#0f0f10;z-index:5}.tab,.btn{border:1px solid #36363c;background:var(--card);color:var(--text);padding:10px 12px;border-radius:999px;white-space:nowrap}.tab.active,.btn.primary{background:var(--text);color:#111}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid #2c2c31;border-radius:18px;padding:16px;margin-bottom:12px}.today{border-color:var(--accent)}.day{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.meal{font-size:19px;font-weight:800}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:var(--soft);font-size:12px}.stars button{background:none;border:0;color:#666;font-size:25px;padding:0 2px}.stars button.on{color:var(--accent)}details{margin-top:10px}summary{cursor:pointer}.cook{margin-top:12px;padding-top:12px;border-top:1px solid #303035}.cook ol,.cook ul{padding-left:21px}.gitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.gitem input{width:22px;height:22px}.checked{opacity:.45;text-decoration:line-through}.section{font-weight:800;margin:18px 0 8px}.empty{text-align:center;color:var(--muted);padding:28px}.status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;padding:10px 14px;border-radius:999px;display:none}.gactions{display:flex;gap:10px;margin:4px 0 14px}.gactions .btn{width:100%;font-weight:800;cursor:pointer}</style></head><body><div class="wrap"><h1>Stupid Bitch Meals</h1><div class="sub">Dinner. Groceries. No spreadsheet cosplay.</div><div class="tabs"><button class="tab active" data-tab="week">Tonight</button><button class="tab" data-tab="recipes">Recipes</button><button class="tab" data-tab="groceries">Groceries</button><button class="tab" data-tab="usefirst">Use First</button><button class="tab" data-tab="favorites">Favorites</button></div><section id="week" class="panel active"><div id="weekList"></div></section><section id="recipes" class="panel"><div id="recipeList"></div></section><section id="groceries" class="panel"><div class="gactions"><button id="copyGroceries" class="btn primary">Copy Grocery List</button></div><div id="groceryList"></div></section><section id="usefirst" class="panel"><div id="useFirstList"></div></section><section id="favorites" class="panel"><div id="favList"></div></section></div><div id="status" class="status"></div><script>const SB='https://bzxrnfgteqdndrgttjms.supabase.co',KEY='sb_publishable_Hz_DGBDYxSaHiGyK7PkUwQ_LLknUQdO',H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};let recipes=[],meals=[],groceries=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function get(p){let r=await fetch(SB+'/rest/v1/'+p,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}async function rpc(n,b){let r=await fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:H,body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text())}function toast(t){status.textContent=t;status.style.display='block';setTimeout(()=>status.style.display='none',1500)}function stars(r){return `<div class="stars" data-id="${r.id}">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" class="${(r.rating||0)>=n?'on':''}">★</button>`).join('')}</div>`}function cook(r){return `<div class="cook"><b>What you need</b><ul>${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>Do this</b><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`}function renderWeek(){let today=new Date().toLocaleDateString('en-US',{weekday:'long'}),m=meals.find(x=>x.day_name===today),r=m&&recipes.find(x=>x.id===m.recipe_id);weekList.innerHTML=m?`<div class="card today"><div class="day">TONIGHT · ${esc(today)}</div><div class="meal">${esc(m.meal_name)}</div>${r?`<div class="meta">${r.minutes||'?'} min · serves ${r.servings||3}</div>${cook(r)}${stars(r)}`:'<div class="meta">No recipe needed.</div>'}</div><div class="section">Rest of the week</div>`+meals.filter(x=>x.day_name!==today).map(x=>`<div class="card"><div class="day">${esc(x.day_name)}</div><div class="meal">${esc(x.meal_name)}</div></div>`).join(''):'<div class="empty">Nothing planned for tonight.</div>'}function renderRecipes(){recipeList.innerHTML=recipes.map(r=>`<div class="card"><div class="meal">${esc(r.name)}</div><div class="meta">${r.minutes||'?'} min · serves ${r.servings||3}</div>${stars(r)}<details><summary>Open recipe</summary>${cook(r)}</details></div>`).join('')}function renderGroceries(){let cats=[...new Set(groceries.map(g=>g.category||'Other'))];groceryList.innerHTML=cats.map(c=>`<div class="section">${esc(c)}</div>`+groceries.filter(g=>(g.category||'Other')===c).map(g=>`<div class="card gitem"><input type="checkbox" data-gid="${g.id}" ${g.checked?'checked':''}><div class="${g.checked?'checked':''}"><b>${esc(g.item)}</b><div class="small">${esc(g.quantity||'')}</div></div><span class="pill">${esc(g.storage||'')}</span></div>`).join('')).join('')}function groceryText(){return groceries.filter(g=>!g.checked).map(g=>`${g.item}${g.quantity?', '+g.quantity:''}`).join('\n')}async function copyGroceries(){let text=groceryText();if(!text){toast('Nothing left to buy');return}try{await navigator.clipboard.writeText(text);toast('Grocery list copied')}catch(e){let t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();document.execCommand('copy');t.remove();toast('Grocery list copied')}}function days(g){if(g.package_use_by)return Math.ceil((new Date(g.package_use_by+'T12:00:00')-new Date())/86400000);if(!g.purchased_at||!g.estimated_life_days)return null;return g.estimated_life_days-Math.floor((new Date()-new Date(g.purchased_at+'T12:00:00'))/86400000)}function renderUseFirst(){let a=groceries.filter(g=>g.checked||g.purchased_at).map(g=>({...g,d:days(g)})).sort((a,b)=>(a.d??999)-(b.d??999));useFirstList.innerHTML=a.length?a.map(g=>`<div class="card row"><div><div class="meal">${esc(g.item)}</div><div class="meta">${g.d==null?'Check date':g.d<=0?'Use now':g.d+' day(s) left'} · ${esc(g.storage)}</div></div><span class="pill">${g.d!=null&&g.d<=1?'EAT NOW':g.d!=null&&g.d<=3?'SOON':'OK'}</span></div>`).join(''):'<div class="empty">Purchased food will show here.</div>'}function renderFavs(){let a=recipes.filter(r=>(r.rating||0)>=4||r.favorite);favList.innerHTML=a.length?a.map(r=>`<div class="card"><div class="meal">${esc(r.name)}</div>${stars(r)}<details><summary>Open recipe</summary>${cook(r)}</details></div>`).join(''):'<div class="empty">4–5 star meals show here.</div>'}function render(){renderWeek();renderRecipes();renderGroceries();renderUseFirst();renderFavs()}async function load(){try{[recipes,meals,groceries]=await Promise.all([get('sbg_recipes?select=*&order=id'),get('sbg_meal_plan?select=*&order=sort_order'),get('sbg_groceries?select=*&order=category,item')]);render()}catch(e){console.error(e);toast('Could not load data')}}document.addEventListener('click',async e=>{if(e.target.matches('.tab')){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.getElementById(e.target.dataset.tab).classList.add('active')}if(e.target.id==='copyGroceries'){await copyGroceries()}if(e.target.dataset.rate){let id=+e.target.closest('.stars').dataset.id,n=+e.target.dataset.rate;await rpc('sbg_set_recipe_rating',{p_recipe_id:id,p_rating:n});let r=recipes.find(x=>x.id===id);r.rating=n;r.favorite=n>=4;render();toast('Rated '+n+'/5')}});document.addEventListener('change',async e=>{if(e.target.dataset.gid){let id=+e.target.dataset.gid,v=e.target.checked;await rpc('sbg_set_grocery_checked',{p_grocery_id:id,p_checked:v});let g=groceries.find(x=>x.id===id);g.checked=v;if(v&&!g.purchased_at)g.purchased_at=new Date().toISOString().slice(0,10);render()}});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');load()</script></body></html>
